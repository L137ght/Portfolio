    body {

<body class="bg-background text-on-background font-body-md">
<!-- Main Wrapper -->
<div class="relative flex min-h-screen w-full flex-col bg-background overflow-x-hidden">
<!-- Minimal Focused Header -->
<header class="flex items-center justify-between px-margin-mobile py-4 lg:px-margin-desktop">
<button class="flex items-center justify-center h-12 w-12 rounded-full hover:bg-surface-container transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex-grow text-center">
<h2 class="font-headline-md-mobile lg:font-headline-md text-on-surface">Order Success</h2>
</div>
<div class="w-12"></div> <!-- Spacer for centering -->
</header>
<!-- Content Area -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-12 max-w-lg mx-auto w-full text-center">
<!-- Success Visual -->
<div class="relative mb-8">
<!-- Decorative Glow Background -->
<div class="absolute inset-0 bg-primary/10 blur-3xl rounded-full scale-150"></div>
<!-- Main Success Icon Container -->
<div class="relative z-10 flex h-32 w-32 items-center justify-center rounded-full bg-primary-container text-on-primary-container">
<span class="material-symbols-outlined !text-[64px]" data-icon="check_circle" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
<!-- Typography Section -->
<div class="space-y-4 mb-10">
<h1 class="font-display-lg-mobile lg:font-display-lg text-on-background">Payment successful!</h1>
<p class="font-body-lg text-on-surface-variant max-w-xs mx-auto">
                    Your Sweet Crusheez order has been placed. We're getting your cold-pressed energy ready!
                </p>
<div class="inline-block px-4 py-1 bg-secondary-container text-on-secondary-container rounded-full font-label-sm uppercase tracking-widest">
                    Order #SCZ-10428
                </div>
</div>
<!-- Image Card (Subtle Branding) -->
<div class="w-full aspect-video rounded-xl overflow-hidden mb-12 shadow-sm border border-outline-variant/30">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="A lush and vibrant close-up of fresh green sugarcanes being cold-pressed into a sparkling glass of juice. The scene is illuminated by warm, natural morning sunlight, highlighting the moisture and organic texture of the plants. The overall aesthetic is clean, minimalist, and refreshing, following the brand's organic modernism style with soft earth tones and a high-key light mode feel." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAOPkOB94pufkSiwcMZaHhEukHPVOOE38dWcOdQ5KKJUGj8ieDnm9S7E4oSfe22ECeMI-lP-wG4T0S3KxhVY507sEUqkXLl7gUmvBTnz2t85Y5bbzSOsBSpM0LZG_jVbeTsAOBQJNQ-Vf9mJqZzNq4Q-JWjpXIcB1vkFiUmPFg_Wo4IKhm0SaCMQii_fo6FFte83cbd8uKHL-gT5G6mp0DSuV9loAZoYHu11OugKzMwQZHNh7V5fqX0y8teUg1wsmYO8W7fj8O9TJw_');">
</div>
</div>
<!-- CTAs -->
<div class="flex flex-col w-full gap-4">
<button class="flex items-center justify-center h-12 w-full rounded-full bg-primary text-on-primary font-bold transition-transform active:scale-95 shadow-md">
                    Track Order
                    <span class="material-symbols-outlined ml-2" data-icon="local_shipping">local_shipping</span>
</button>
<button class="flex items-center justify-center h-12 w-full rounded-full bg-surface-container-high text-primary font-bold border border-outline-variant transition-colors hover:bg-surface-dim">
                    Back to Home
                    <span class="material-symbols-outlined ml-2" data-icon="house">house</span>
</button>
</div>
</main>
<!-- Footer / Safety Space -->
<footer class="py-8 text-center">
<p class="font-label-sm text-outline">THANK YOU FOR CHOOSING ORGANIC ENERGY</p>
</footer>
</div>
